name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Recreate .env from GitHub Secrets
        run: |
          cat <<EOF > .env
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev \
            build-essential libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      # Runs ONLY if the build step above failed. Uploads the full,
      # guaranteed-complete .buildozer log directory as a downloadable
      # zip - no more scrolling through a giant page or fighting a
      # browser that chokes on huge log text. Download it from this
      # run's Artifacts section afterward and open the .txt files
      # directly in a text editor.
      - name: Upload full build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-failure-logs
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/logs/
          if-no-files-found: warn

      - name: Upload the built APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: bin/*.apk
