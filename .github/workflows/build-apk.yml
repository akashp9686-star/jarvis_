name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab (the "Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Recreate .env from GitHub Secrets
        # .env is gitignored (never committed) - this writes it fresh
        # inside the runner, using values from repo Settings > Secrets
        # and variables > Actions, so the real keys never touch git history.
        run: |
          cat <<EOF > .env
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          EOF

      - name: Set up Python 3.11
        # Pinned deliberately - buildozer/python-for-android build an
        # internal "hostpython3" that must match this version, and letting
        # either float to "latest" is what caused the 3.11 vs 3.14 mismatch.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf \
            libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev

      - name: Install pinned buildozer / cython
        # (python-for-android itself is pinned separately via
        # p4a.branch in buildozer.spec - buildozer always git-clones
        # its own copy of p4a, ignoring any pip-installed version,
        # so pinning it here would do nothing.)
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload the built APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: bin/*.apk
